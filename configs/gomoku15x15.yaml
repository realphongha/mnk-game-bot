board_game:
  name: gomoku
  m: 15
  n: 15
  k: 5
  cell_size: 30
  fps: 5
  menu_font_size: 30
  button_font_size: 25
  symbol_font_size: 30
bot:
  algorithm: alphazero
  alphazero:
    max_thinking_time: 2.0  # in seconds
    batch: 32
    workers: 8
    exploration_const: 1.4142135623730951
    dirichlet_alpha: 0.3
    dirichlet_eps: 0.25
    exp_dir: runs
    device: cuda
    debug: False
    it: 50
    net:
      type: residual
      residual:
        in_channels: 2
        conv_channels: 32
        res_blocks: 3
    mcts_warm_start:
      self_play_games: 0
      lr: 0.0001
      eps: 2
    self_play_games: 32
    self_play_games_vs_random: 4
    self_play_games_vs_mcts: 4
    temperature: [1.0, 0.01]
    draw_reward: 0.0
    lr_scheduler:
      init_lr: 0.0001
      min_lr: 0.00001
    eps: 1
    arena_games: 32
    eval: vs_last  # vs_mcts, vs_last
  mcts:
    max_thinking_time: 1.0  # in seconds
    max_rollout: 1000000000
    processes: 4  # number of processes
    policy: simple 
    exploration_const: 1.4142135623730951
    num_simulations: 4
