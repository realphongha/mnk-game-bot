board_game:
  name: gomoku
  m: 7
  n: 7
  k: 5
  cell_size: 60
  fps: 5
  menu_font_size: 40
  button_font_size: 20
  symbol_font_size: 60
bot:
  algorithm: alphazero
  alphazero:
    max_thinking_time: 0.5  # in seconds
    batch: 32
    workers: 2
    exploration_const: 1.4142135623730951
    dirichlet_alpha: 0.3
    dirichlet_eps: 0.25
    exp_dir: runs
    device: cuda
    debug: False
    it: 200
    net:
      type: residual
      residual:
        in_channels: 2
        conv_channels: 32 
        res_blocks: 2
    mcts_warm_start:
      self_play_games: 200
      lr: 0.005
      eps: 5
    self_play_games: 30
    self_play_games_vs_random: 5
    self_play_games_vs_mcts: 5
    temperature: [1.0, 0.01]
    lr_scheduler:
      init_lr: 0.001
      min_lr: 0.00001
    eps: 2
    arena_games: 30
    eval: vs_mcts  # vs_mcts, vs_last
  mcts:
    # max_thinking_time: 2.0  # in seconds
    max_thinking_time: 0.5  # in seconds
    max_rollout: 1000000000
    processes: 2  # number of processes
    policy: simple
    exploration_const: 1.4142135623730951
    num_simulations: 2
