board_game:
  name: gomoku7x7
  m: 7
  n: 7
  k: 5
  cell_size: 60
  fps: 5
  menu_font_size: 40
  button_font_size: 20
  symbol_font_size: 60
bot:
  algorithm: alphazero
  alphazero:
    max_thinking_time: 0.2  # in seconds
    batch: 32
    workers: 8
    exploration_const: 2
    dirichlet_alpha: 0.3
    dirichlet_eps: 0.25
    exp_dir: runs
    device: cuda
    debug: False
    it: 1000
    net:
      type: residual
      residual:
        in_channels: 2
        conv_channels: 128
        res_blocks: 8
    mcts_warm_start:
      self_play_games: 1024
      lr: 0.005
      eps: 20
    self_play_games: 512
    self_play_games_vs_random: 32
    self_play_games_vs_mcts: 32
    temperature: [1.0, 0.01]
    draw_reward: 0.0
    lr_scheduler:
      init_lr: 0.001
      min_lr: 0.00001
    eps: 1
    arena_games: 64
    eval: vs_last  # vs_mcts, vs_last
  mcts:
    # max_thinking_time: 2.0  # in seconds
    max_thinking_time: 0.5  # in seconds
    max_rollout: 1000000000
    processes: 1  # number of processes
    policy: simple
    exploration_const: 1.4142135623730951
    num_simulations: 1
