board_game:
  name: gomoku9x9
  m: 9 
  n: 9
  k: 5
  cell_size: 40
  fps: 5
  menu_font_size: 40
  button_font_size: 20
  symbol_font_size: 40
bot:
  algorithm: alphazero
  alphazero:
    max_thinking_time: 2.0  # in seconds
    batch: 32
    workers: 8
    exploration_const: 2
    dirichlet_alpha: 0.3
    dirichlet_eps: 0.25
    exp_dir: runs
    device: cuda
    debug: False
    it: 128
    net:
      type: residual
      residual:
        in_channels: 2
        conv_channels: 128
        res_blocks: 8
    mcts_warm_start:
      self_play_games: 128
      lr: 0.005
      eps: 10
    self_play_games: 128
    self_play_games_vs_random: 8
    self_play_games_vs_mcts: 8
    temperature: [1.0, 0.01]
    draw_reward: 0.0
    lr_scheduler:
      init_lr: 0.001
      min_lr: 0.00001
    eps: 10
    arena_games: 16
    eval: vs_last  # vs_mcts, vs_last
  mcts:
    max_thinking_time: 5.0  # in seconds
    max_rollout: 1000000000
    processes: 8  # number of processes
    policy: simple
    exploration_const: 1.4142135623730951
    num_simulations: 1
