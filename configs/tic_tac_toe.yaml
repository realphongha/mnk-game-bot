board_game:
  name: tic-tac-toe
  m: 3
  n: 3
  k: 3
  cell_size: 90
  fps: 5
  menu_font_size: 30
  button_font_size: 15
  symbol_font_size: 90
bot:
  algorithm: alphazero
  alphazero:
    max_thinking_time: 1.0  # in seconds
    batch: 32
    workers: 4
    exploration_const: 2
    dirichlet_alpha: 0.3
    dirichlet_eps: 0.25
    exp_dir: runs
    device: cuda
    debug: False
    it: 100
    net:
      type: residual
      residual:
        in_channels: 2
        conv_channels: 64
        res_blocks: 4
    mcts_warm_start:
      self_play_games: 0
      lr: 0.02
      eps: 5
    temperature: [1.0, 0.01]
    draw_reward: 0.0  # set < 0.0 (e.g., -0.1) discourage draw
    lr_scheduler:
      init_lr: 0.01
      min_lr: 0.0001
    eval: vs_last  # vs_mcts, vs_last
    self_play_games: 64
    self_play_games_vs_random: 8
    self_play_games_vs_mcts: 8
    eps: 5
    arena_games: 32
  mcts:
    max_thinking_time: 0.1  # in seconds
    max_rollout: 1000000000
    processes: 1  # number of processes
    policy: simple
    exploration_const: 1.4142135623730951
    num_simulations: 1
